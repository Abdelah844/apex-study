# Cada vez que subes cambios, GitHub ejecuta las pruebas automáticas.
# Si alguna falla, verás una ✗ roja junto al commit.
name: Pruebas
on: [push, pull_request]
jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm test
